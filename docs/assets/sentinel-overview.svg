  <circle cx="770" cy="240" r="3.5" fill="#ef4444"/><text x="782" y="244" fill="#fecaca" font-family="Consolas, monospace" font-size="9.5">192.168.56.101  SSH Brute Force</text>
  <rect x="758" y="258" width="259" height="24" rx="5" fill="#080b11" stroke="#1e293b"/>
  <circle cx="770" cy="270" r="3.5" fill="#f5943a"/><text x="782" y="274" fill="#fed7aa" font-family="Consolas, monospace" font-size="9.5">203.0.113.45    Denial of Service</text>
  <rect x="758" y="288" width="259" height="24" rx="5" fill="#080b11" stroke="#1e293b"/>
  <circle cx="770" cy="300" r="3.5" fill="#33c777"/><text x="782" y="304" fill="#86efac" font-family="Consolas, monospace" font-size="9.5">192.168.56.10   ONLINE (Protected)</text>
