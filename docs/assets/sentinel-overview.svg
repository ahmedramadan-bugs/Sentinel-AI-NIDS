  <rect x="330" y="162" width="270" height="220" rx="18" fill="#111826" stroke="#00d9c0" stroke-width="2.4"/>
  <rect x="330" y="162" width="270" height="6" rx="3" fill="#00d9c0"/>

  <!-- Shield + AI Core Emblem -->
  <circle cx="465" cy="236" r="38" fill="#0c1524" stroke="rgba(0,217,192,0.5)" stroke-width="2"/>
  <path d="M465 208 L488 218 V236 C488 251 478 261 465 266 C452 261 442 251 442 236 V218 Z" fill="rgba(0,217,192,0.16)" stroke="#00d9c0" stroke-width="2.4"/>
