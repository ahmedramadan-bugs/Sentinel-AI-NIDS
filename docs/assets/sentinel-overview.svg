  <circle cx="66" cy="158" r="10" fill="#0b1322" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="66" cy="158" r="4" fill="#38bdf8"/>
  <text x="86" y="155" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Suricata IDS</text>
  <text x="86" y="170" fill="#7dd3fc" font-family="Consolas, monospace" font-size="9.5">runtime/eve.json</text>

  <!-- Card: Live Flows -->
  <rect x="42" y="198" width="146" height="56" rx="10" fill="#182135" stroke="#00d9c0" stroke-width="1.6"/>
  <path d="M56 226 L62 220 L68 232 L74 222 L78 226" fill="none" stroke="#00d9c0" stroke-width="1.8"/>
  <text x="88" y="223" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Live Flows</text>
