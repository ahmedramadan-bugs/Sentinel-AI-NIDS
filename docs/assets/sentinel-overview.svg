  <text x="811" y="414" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Linux iptables</text>
  <text x="811" y="431" text-anchor="middle" fill="#fca5a5" font-family="Consolas, monospace" font-size="9.5">NIDS_DROP Chain</text>

  <rect x="893" y="388" width="142" height="58" rx="10" fill="#182135" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="964" y="414" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Windows netsh</text>
  <text x="964" y="431" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="9.5">Host Firewall</text>

  <rect x="740" y="456" width="142" height="58" rx="10" fill="#182135" stroke="#f5943a" stroke-width="1.5"/>
  <text x="811" y="482" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Cisco Switch</text>
  <text x="811" y="499" text-anchor="middle" fill="#fdba74" font-family="Consolas, monospace" font-size="9.5">SSH ACL Block</text>

  <rect x="893" y="456" width="142" height="58" rx="10" fill="#182135" stroke="#33c777" stroke-width="1.5"/>
  <text x="964" y="482" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Safe Dry-Run</text>
