  <text x="668" y="262" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">Stream alerts &amp; status</text>

  <!-- Center -> Bottom Right (Block bad IPs) -->
