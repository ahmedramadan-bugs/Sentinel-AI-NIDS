  <!-- ==================== ANIMATED MARCHING-ANTS ARROWS ==================== -->
  <!-- Left -> Center -->
  <path class="flow-fast" d="M 222 158 C 275 158, 275 235, 326 235" fill="none" stroke="#e2e8f0" stroke-width="2.4" marker-end="url(#arrWhite)"/>
  <text x="270" y="176" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Parse events</text>

  <path class="flow-fast" d="M 222 400 C 275 400, 275 315, 326 315" fill="none" stroke="#e2e8f0" stroke-width="2.4" marker-end="url(#arrWhite)"/>
  <text x="270" y="388" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Align &amp; match</text>

  <!-- Center <-> Top Right (Blue & Coral opposing arrows like CrowdSec) -->
  <path class="flow-fast" d="M 602 215 C 660 190, 665 110, 735 88" fill="none" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <text x="658" y="132" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">12-feature vector</text>

  <path class="flow-fast" d="M 735 128 C 675 148, 670 220, 606 242" fill="none" stroke="#ef4444" stroke-width="2.4" marker-end="url(#arrCoral)"/>
