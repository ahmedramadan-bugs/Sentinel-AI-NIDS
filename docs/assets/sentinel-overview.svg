  <text x="115" y="447" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="9.5">Signature Fallback</text>

  <!-- Curly Brace 2 -->
  <path d="M 196 340 C 210 340, 206 400, 220 400 C 206 400, 210 460, 196 460" fill="none" stroke="#64748b" stroke-width="2.2"/>

