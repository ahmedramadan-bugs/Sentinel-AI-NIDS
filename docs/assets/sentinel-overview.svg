<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%">
  <defs>
    <linearGradient id="bgOv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#11192b"/>
    </linearGradient>
    <pattern id="gridOv" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <marker id="arrWhite" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e2e8f0"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrCoral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <style>
    .flow-fast { stroke-dasharray: 6 6; animation: march 420ms linear infinite; }
    .flow-rev  { stroke-dasharray: 6 6; animation: marchRev 420ms linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    @keyframes marchRev { to { stroke-dashoffset: 12; } }
  </style>

  <!-- Outer Frame -->
  <rect width="1080" height="560" rx="16" fill="url(#bgOv)" stroke="#232c40" stroke-width="2"/>
  <rect width="1080" height="560" rx="16" fill="url(#gridOv)"/>

  <!-- ==================== LEFT COLUMN: INPUTS ==================== -->
  <!-- Group 1: Network & Attack Sources -->
  <text x="115" y="46" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Network &amp; Attack Sources</text>

  <!-- Card: Kali Linux -->
  <rect x="42" y="62" width="146" height="56" rx="10" fill="#182135" stroke="#ef4444" stroke-width="1.6"/>
  <rect x="54" y="76" width="24" height="18" rx="3" fill="#0f0709" stroke="#fca5a5" stroke-width="1.4"/>
  <path d="M59 82 L63 85 L59 88 M65 88 H71" stroke="#ef4444" stroke-width="1.4" fill="none"/>
  <text x="88" y="88" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Kali Console</text>
  <text x="88" y="103" fill="#fca5a5" font-family="Consolas, monospace" font-size="9.5">Nmap • Hydra • DoS</text>

