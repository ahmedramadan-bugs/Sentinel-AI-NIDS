<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" width="100%">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0e1627"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0e1422"/>
    </linearGradient>
    <linearGradient id="redCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#351118"/>
      <stop offset="100%" stop-color="#1a090d"/>
    </linearGradient>
    <linearGradient id="greenCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102c24"/>
      <stop offset="100%" stop-color="#0a1b16"/>
    </linearGradient>
    <pattern id="gridP" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.055)"/>
    </pattern>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#00d9c0"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <style>
    .pipe-c { stroke-dasharray: 8 6; animation: flowC 1.4s linear infinite; }
    .pipe-r { stroke-dasharray: 8 6; animation: flowC 0.85s linear infinite; }
    .shield-ring { animation: shieldPulse 2.4s ease-out infinite; transform-origin: 920px 142px; }
    @keyframes flowC { to { stroke-dashoffset: -28; } }
    @keyframes shieldPulse {
      0% { r: 24; opacity: 0.85; }
      100% { r: 44; opacity: 0; }
    }
  </style>

  <!-- Canvas -->
  <rect width="1040" height="380" rx="16" fill="url(#bgP)"/>
  <rect width="1040" height="380" rx="16" fill="url(#gridP)"/>
  <rect x="1" y="1" width="1038" height="378" rx="15" fill="none" stroke="rgba(0,217,192,0.22)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="34" fill="#00d9c0" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.2">SENTINEL-AI  //  LIVE DETECTION &amp; ACTIVE DEFENSE ARCHITECTURE</text>
  <rect x="850" y="18" width="160" height="24" rx="12" fill="rgba(51,199,119,0.12)" stroke="rgba(51,199,119,0.4)"/>
  <circle cx="868" cy="30" r="4" fill="#33c777"/>
  <text x="880" y="34" fill="#86efac" font-family="Consolas, monospace" font-size="11" font-weight="700">REAL-TIME PIPELINE</text>

  <!-- Connection Paths -->
  <path id="p1" class="pipe-r" d="M 186 142 L 234 142" fill="none" stroke="#ef4444" stroke-width="2.4" marker-end="url(#arrR)"/>
  <path id="p2" class="pipe-c" d="M 396 142 L 444 142" fill="none" stroke="#00d9c0" stroke-width="2.4" marker-end="url(#arrC)"/>
  <path id="p3a" class="pipe-c" d="M 606 126 C 632 126, 632 95, 654 95" fill="none" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrC)"/>
  <path id="p3b" class="pipe-c" d="M 606 158 C 632 158, 632 190, 654 190" fill="none" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrC)"/>
  <path id="p4a" class="pipe-r" d="M 816 95 C 836 95, 836 128, 854 128" fill="none" stroke="#ef4444" stroke-width="2.4" marker-end="url(#arrR)"/>
  <path id="p4b" class="pipe-c" d="M 816 190 C 836 190, 836 156, 854 156" fill="none" stroke="#00d9c0" stroke-width="2.2" marker-end="url(#arrC)"/>
  <path id="p5" class="pipe-c" d="M 525 198 L 525 270" fill="none" stroke="#00d9c0" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Animated Moving Packet Orbs -->
  <circle r="4.5" fill="#ef4444" filter="url(#glowRed)">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 186 142 L 234 142"/>
  </circle>
  <circle r="4.5" fill="#00d9c0" filter="url(#glowCyan)">
    <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M 396 142 L 444 142"/>
  </circle>
  <circle r="4.5" fill="#33c777" filter="url(#glowCyan)">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M 606 126 C 632 126, 632 95, 654 95"/>
  </circle>
  <circle r="5" fill="#ef4444" filter="url(#glowRed)">
    <animateMotion dur="1.4s" begin="1.1s" repeatCount="indefinite" path="M 816 95 C 836 95, 836 128, 854 128"/>
  </circle>
  <circle r="4" fill="#00d9c0" filter="url(#glowCyan)">
    <animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M 525 198 L 525 270"/>
  </circle>

  <!-- 1. Traffic / Kali -->
  <rect x="28" y="84" width="158" height="116" rx="14" fill="url(#redCardGrad)" stroke="rgba(239,68,68,0.65)" stroke-width="1.8"/>
  <rect x="28" y="84" width="158" height="4" rx="2" fill="#ef4444"/>
  <g transform="translate(107, 114)">
    <rect x="-15" y="-10" width="30" height="18" rx="3" fill="#0f0709" stroke="#fca5a5" stroke-width="1.6"/>
    <path d="M-9 -4 L-4 0 L-9 4 M-1 4 H7" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
  <text x="107" y="148" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Kali / Traffic</text>
  <text x="107" y="167" text-anchor="middle" fill="#fca5a5" font-family="Consolas, monospace" font-size="10.5">Nmap • Hydra • DoS</text>
  <text x="107" y="184" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">Live &amp; Demo Console</text>

  <!-- 2. Suricata Collector -->
  <rect x="238" y="84" width="158" height="116" rx="14" fill="url(#cardGrad)" stroke="rgba(56,189,248,0.6)" stroke-width="1.8"/>
  <rect x="238" y="84" width="158" height="4" rx="2" fill="#38bdf8"/>
  <g transform="translate(317, 114)">
    <circle cx="0" cy="0" r="13" fill="#0b1322" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
  </g>
  <text x="317" y="148" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Suricata Parser</text>
  <text x="317" y="167" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="10.5">eve.json tailing</text>
  <text x="317" y="184" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">Flow + Alert Events</text>

  <!-- 3. Feature Alignment -->
  <rect x="448" y="84" width="158" height="116" rx="14" fill="url(#cardGrad)" stroke="rgba(0,217,192,0.7)" stroke-width="1.8"/>
  <rect x="448" y="84" width="158" height="4" rx="2" fill="#00d9c0"/>
  <g transform="translate(527, 114)">
    <rect x="-14" y="-11" width="28" height="22" rx="4" fill="#0b1322" stroke="#00d9c0" stroke-width="1.6"/>
    <line x1="-8" y1="-4" x2="8" y2="-4" stroke="#00d9c0" stroke-width="1.6"/>
    <line x1="-8" y1="1" x2="8" y2="1" stroke="#00d9c0" stroke-width="1.6"/>
    <line x1="-8" y1="6" x2="3" y2="6" stroke="#00d9c0" stroke-width="1.6"/>
  </g>
  <text x="527" y="148" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">12-Feature Vector</text>
  <text x="527" y="167" text-anchor="middle" fill="#00d9c0" font-family="Consolas, monospace" font-size="10.5">Impute • Log1p • Scale</text>
  <text x="527" y="184" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">Zero Serving Skew</text>

  <!-- 4A. XGBoost AI -->
  <rect x="658" y="56" width="158" height="78" rx="12" fill="url(#greenCardGrad)" stroke="rgba(51,199,119,0.7)" stroke-width="1.8"/>
  <text x="737" y="84" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="10.5" font-weight="700">AI ENGINE (ML)</text>
  <text x="737" y="105" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">XGBoost Classifier</text>
  <text x="737" y="122" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="9.5">6 Attack Classes • 92.3% F1</text>

  <!-- 4B. Deterministic Rules -->
  <rect x="658" y="150" width="158" height="78" rx="12" fill="url(#cardGrad)" stroke="rgba(56,189,248,0.6)" stroke-width="1.8"/>
  <text x="737" y="178" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="10.5" font-weight="700">FALLBACK LAYER</text>
  <text x="737" y="199" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">Deterministic Rules</text>
  <text x="737" y="216" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">Signature Correlation</text>

  <!-- 5. Active Response -->
  <rect x="858" y="84" width="154" height="116" rx="14" fill="url(#redCardGrad)" stroke="rgba(239,68,68,0.75)" stroke-width="1.8"/>
  <rect x="858" y="84" width="154" height="4" rx="2" fill="#ef4444"/>
  <circle class="shield-ring" cx="935" cy="116" r="22" fill="none" stroke="#ef4444" stroke-width="1.6"/>
  <g transform="translate(935, 116)">
    <path d="M0 -14 L12 -9 V2 C12 9 7 14 0 17 C-7 14 -12 9 -12 2 V-9 Z" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1.8"/>
    <path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#fecaca" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="935" y="152" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Active Defense</text>
  <text x="935" y="171" text-anchor="middle" fill="#fca5a5" font-family="Consolas, monospace" font-size="10.5">BLOCK • ALERT • LOG</text>
  <text x="935" y="187" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">Firewall &amp; Cisco</text>

  <!-- Bottom: SQLite + Web SOC -->
  <rect x="238" y="274" width="578" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(0,217,192,0.5)" stroke-width="1.8"/>
  <text x="527" y="303" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">SQLite Event Store  →  Live Web SOC Dashboard</text>
  <text x="527" y="328" text-anchor="middle" fill="#00d9c0" font-family="Consolas, monospace" font-size="11">Dashboard  •  Alerts  •  Network Devices (Online/Offline)  •  Kali Console  •  AI Models</text>
</svg>
