<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" width="100%">
  <defs>
    <linearGradient id="bgSoc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,217,192,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,217,192,0)"/>
    </linearGradient>
    <linearGradient id="redRowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(239,68,68,0.22)"/>
      <stop offset="100%" stop-color="rgba(239,68,68,0.04)"/>
    </linearGradient>
  </defs>

  <style>
    .blink-dot { animation: blinkDot 1.6s ease-in-out infinite; }
    .wave-draw { stroke-dasharray: 900; animation: drawWave 4s ease-in-out infinite alternate; }
    .alert-pulse { animation: alertGlow 2s ease-in-out infinite; }
    @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes drawWave { 0% { stroke-dashoffset: 180; } 100% { stroke-dashoffset: 0; } }
    @keyframes alertGlow { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
  </style>

  <!-- Window Frame -->
  <rect width="1040" height="340" rx="16" fill="url(#bgSoc)" stroke="rgba(0,217,192,0.28)" stroke-width="1.5"/>

  <!-- macOS / Browser Top Bar -->
  <rect x="1" y="1" width="1038" height="36" rx="15" fill="#111826"/>
  <circle cx="24" cy="19" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="19" r="5.5" fill="#f5943a"/>
  <circle cx="60" cy="19" r="5.5" fill="#33c777"/>
  <rect x="340" y="8" width="360" height="22" rx="6" fill="#080b11" stroke="#1e293b"/>
  <text x="520" y="23" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">http://127.0.0.1:8080  —  Sentinel-AI SOC</text>

  <!-- Live Health Strip -->
  <rect x="20" y="48" width="1000" height="30" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <circle class="blink-dot" cx="38" cy="63" r="4.5" fill="#33c777"/>
  <text x="50" y="67" fill="#33c777" font-family="Consolas, monospace" font-size="11" font-weight="700">LIVE NIDS</text>
  <text x="160" y="67" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">Sniffer: <tspan fill="#e2e8f0" font-weight="700">ACTIVE</tspan></text>
  <text x="340" y="67" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">AI Engine: <tspan fill="#00d9c0" font-weight="700">XGBoost ONLINE</tspan></text>
  <text x="580" y="67" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">Inference: <tspan fill="#86efac" font-weight="700">1.8 ms</tspan></text>
  <text x="770" y="67" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">Defense: <tspan fill="#f5943a" font-weight="700">ACTIVE POLICY</tspan></text>

  <!-- 4 Mini KPI Cards -->
  <rect x="20" y="90" width="238" height="62" rx="10" fill="#111826" stroke="#1e293b"/>
  <text x="36" y="112" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">TOTAL EVENTS</text>
  <text x="36" y="138" fill="#f8fafc" font-family="Consolas, monospace" font-size="21" font-weight="800">1,428</text>

  <rect x="274" y="90" width="238" height="62" rx="10" fill="#111826" stroke="rgba(239,68,68,0.45)"/>
  <text x="290" y="112" fill="#fca5a5" font-family="Consolas, monospace" font-size="10">THREATS DETECTED</text>
  <text x="290" y="138" fill="#ef4444" font-family="Consolas, monospace" font-size="21" font-weight="800">24</text>

  <rect x="528" y="90" width="238" height="62" rx="10" fill="#111826" stroke="rgba(245,148,58,0.45)"/>
  <text x="544" y="112" fill="#fdba74" font-family="Consolas, monospace" font-size="10">ACTIVE BLOCKS</text>
  <text x="544" y="138" fill="#f5943a" font-family="Consolas, monospace" font-size="21" font-weight="800">4 IPs</text>

  <rect x="782" y="90" width="238" height="62" rx="10" fill="#111826" stroke="rgba(0,217,192,0.45)"/>
  <text x="798" y="112" fill="#00d9c0" font-family="Consolas, monospace" font-size="10">MODEL MACRO F1</text>
  <text x="798" y="138" fill="#00d9c0" font-family="Consolas, monospace" font-size="21" font-weight="800">92.34%</text>

  <!-- Left Panel: Live Traffic Chart -->
  <rect x="20" y="164" width="492" height="156" rx="12" fill="#111826" stroke="#1e293b"/>
  <text x="36" y="186" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Traffic &amp; Anomaly Stream</text>
  <path d="M 36 296 L 36 270 L 85 262 L 135 276 L 185 240 L 235 256 L 285 215 L 335 245 L 385 205 L 435 232 L 490 218 L 490 296 Z" fill="url(#areaGrad)"/>
  <path class="wave-draw" d="M 36 270 L 85 262 L 135 276 L 185 240 L 235 256 L 285 215 L 335 245 L 385 205 L 435 232 L 490 218" fill="none" stroke="#00d9c0" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="blink-dot" cx="385" cy="205" r="5" fill="#ef4444" stroke="#080b11" stroke-width="1.5"/>

  <!-- Right Panel: Live Security Events -->
  <rect x="528" y="164" width="492" height="156" rx="12" fill="#111826" stroke="#1e293b"/>
  <text x="544" y="186" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Correlated Detections &amp; Device Status</text>

  <rect class="alert-pulse" x="542" y="198" width="464" height="32" rx="7" fill="url(#redRowGrad)" stroke="rgba(239,68,68,0.45)"/>
  <text x="554" y="218" fill="#fecaca" font-family="Consolas, monospace" font-size="10.5" font-weight="700">● 192.168.56.101  →  SSH Brute Force  (ML 98%)   [BLOCKED]</text>

  <rect x="542" y="236" width="464" height="32" rx="7" fill="rgba(245,148,58,0.1)" stroke="rgba(245,148,58,0.3)"/>
  <text x="554" y="256" fill="#fed7aa" font-family="Consolas, monospace" font-size="10.5">● 203.0.113.45    →  Denial of Service (ML+Rule) [ALERT]</text>

  <rect x="542" y="274" width="464" height="32" rx="7" fill="rgba(51,199,119,0.08)" stroke="rgba(51,199,119,0.25)"/>
  <text x="554" y="294" fill="#86efac" font-family="Consolas, monospace" font-size="10.5">● 192.168.56.10   →  Normal HTTPS Traffic          [ONLINE]</text>
</svg>
