<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="100%">
  <defs>
    <linearGradient id="areaTraffic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,217,192,0.32)"/>
      <stop offset="100%" stop-color="rgba(0,217,192,0)"/>
    </linearGradient>
    <linearGradient id="areaThreats" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(239,74,82,0.28)"/>
      <stop offset="100%" stop-color="rgba(239,74,82,0)"/>
    </linearGradient>
  </defs>

  <style>
    .pulse-dot { animation: dotP 2s ease-in-out infinite; }
    .line-anim { stroke-dasharray: 700; animation: drawL 3.5s ease-out infinite alternate; }
    .donut-spin { transform-origin: 878px 258px; animation: donutS 14s linear infinite; }
    @keyframes dotP { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes drawL { 0% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: 0; } }
    @keyframes donutS { to { transform: rotate(360deg); } }
  </style>

  <!-- Outer Window -->
  <rect width="1080" height="540" rx="14" fill="#080b11" stroke="#232c40" stroke-width="1.5"/>

  <!-- Left Sidebar (NIDS.CONSOLE) -->
  <rect x="1" y="1" width="195" height="538" rx="13" fill="#0f1623"/>
  <line x1="196" y1="1" x2="196" y2="539" stroke="#232c40" stroke-width="1"/>

  <!-- Brand -->
  <rect x="14" y="16" width="28" height="28" rx="7" fill="rgba(0,217,192,0.14)" stroke="rgba(0,217,192,0.4)"/>
  <path d="M28 22 L35 25 V30 C35 34 32 37 28 39 C24 37 21 34 21 30 V25 Z" fill="none" stroke="#00d9c0" stroke-width="1.6"/>
  <text x="50" y="29" fill="#e9edf5" font-family="Consolas, monospace" font-size="12.5" font-weight="700">NIDS.CONSOLE</text>
  <text x="50" y="41" fill="#576078" font-family="Segoe UI, sans-serif" font-size="8.5" letter-spacing="0.7">AI-DRIVEN SOC PIPELINE</text>
  <line x1="14" y1="56" x2="182" y2="56" stroke="#1a2233"/>

  <!-- Sidebar Nav Items -->
  <rect x="12" y="68" width="172" height="30" rx="7" fill="rgba(0,217,192,0.13)"/>
  <rect x="12" y="68" width="3" height="30" rx="1.5" fill="#00d9c0"/>
  <text x="28" y="87" fill="#00d9c0" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">Dashboard</text>

  <text x="28" y="118" fill="#8b96ab" font-family="Segoe UI, sans-serif" font-size="11.5">Alerts</text>
  <text x="28" y="146" fill="#8b96ab" font-family="Segoe UI, sans-serif" font-size="11.5">Topology</text>
  <text x="28" y="174" fill="#8b96ab" font-family="Segoe UI, sans-serif" font-size="11.5">Console</text>
  <text x="28" y="202" fill="#8b96ab" font-family="Segoe UI, sans-serif" font-size="11.5">Analytics</text>
  <text x="28" y="230" fill="#8b96ab" font-family="Segoe UI, sans-serif" font-size="11.5">AI Models</text>
  <text x="28" y="258" fill="#8b96ab" font-family="Segoe UI, sans-serif" font-size="11.5">Response / Firewall</text>
  <text x="28" y="286" fill="#8b96ab" font-family="Segoe UI, sans-serif" font-size="11.5">Settings</text>

  <!-- Sidebar Footer -->
  <line x1="14" y1="484" x2="182" y2="484" stroke="#1a2233"/>
  <text x="18" y="502" fill="#576078" font-family="Segoe UI, sans-serif" font-size="9.5">Engine Target</text>
  <text x="18" y="518" fill="#00d9c0" font-family="Consolas, monospace" font-size="10.5">Host Firewall (Local)</text>

  <!-- Top Health Bar -->
  <rect x="197" y="1" width="882" height="36" fill="#111826"/>
  <line x1="197" y1="37" x2="1079" y2="37" stroke="#232c40"/>
  <rect x="214" y="9" width="88" height="20" rx="10" fill="rgba(51,199,119,0.14)" stroke="rgba(51,199,119,0.4)"/>
  <circle class="pulse-dot" cx="226" cy="19" r="3.5" fill="#33c777"/>
  <text x="234" y="23" fill="#33c777" font-family="Consolas, monospace" font-size="10" font-weight="700">LIVE NIDS</text>

  <circle class="pulse-dot" cx="324" cy="19" r="3.5" fill="#33c777"/>
  <text x="334" y="23" fill="#8b96ab" font-family="Consolas, monospace" font-size="10.5">Traffic Sniffer: <tspan fill="#e9edf5" font-weight="700">ACTIVE</tspan></text>

  <circle class="pulse-dot" cx="516" cy="19" r="3.5" fill="#33c777"/>
  <text x="526" y="23" fill="#8b96ab" font-family="Consolas, monospace" font-size="10.5">AI Engine: <tspan fill="#e9edf5" font-weight="700">ONLINE (XGBoost)</tspan></text>

  <circle cx="748" cy="19" r="3.5" fill="#e8c33c"/>
  <text x="758" y="23" fill="#8b96ab" font-family="Consolas, monospace" font-size="10.5">Firewall (Switch): <tspan fill="#e9edf5" font-weight="700">DRY-RUN</tspan></text>

  <!-- Page Header -->
  <text x="218" y="66" fill="#e9edf5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Dashboard</text>
  <text x="218" y="82" fill="#8b96ab" font-family="Segoe UI, sans-serif" font-size="10.5">Live overview of network security posture and correlated detections</text>

  <!-- 4 KPI Cards -->
  <rect x="218" y="96" width="200" height="64" rx="10" fill="#111826" stroke="#232c40"/>
  <text x="232" y="116" fill="#8b96ab" font-family="Consolas, monospace" font-size="9.5">TOTAL EVENTS</text>
  <text x="232" y="144" fill="#e9edf5" font-family="Consolas, monospace" font-size="22" font-weight="800">1,428</text>

  <rect x="430" y="96" width="200" height="64" rx="10" fill="#111826" stroke="rgba(239,74,82,0.45)"/>
  <text x="444" y="116" fill="#fca5a5" font-family="Consolas, monospace" font-size="9.5">DETECTED THREATS</text>
  <text x="444" y="144" fill="#ef4a52" font-family="Consolas, monospace" font-size="22" font-weight="800">24</text>

  <rect x="642" y="96" width="200" height="64" rx="10" fill="#111826" stroke="rgba(245,148,58,0.45)"/>
  <text x="656" y="116" fill="#fdba74" font-family="Consolas, monospace" font-size="9.5">BLOCKED IPS</text>
  <text x="656" y="144" fill="#f5943a" font-family="Consolas, monospace" font-size="22" font-weight="800">4</text>

  <rect x="854" y="96" width="204" height="64" rx="10" fill="#111826" stroke="rgba(0,217,192,0.45)"/>
  <text x="868" y="116" fill="#00d9c0" font-family="Consolas, monospace" font-size="9.5">AI ENGINE LATENCY</text>
  <text x="868" y="144" fill="#00d9c0" font-family="Consolas, monospace" font-size="22" font-weight="800">1.8 ms</text>

  <!-- Middle Row: Traffic Volume Chart (Left) + Attack Distribution Donut (Right) -->
  <rect x="218" y="172" width="535" height="176" rx="12" fill="#111826" stroke="#232c40"/>
  <text x="234" y="194" fill="#e9edf5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Traffic Volume</text>
  <line x1="219" y1="204" x2="752" y2="204" stroke="#1a2233"/>
  <!-- Gridlines -->
  <line x1="236" y1="238" x2="734" y2="238" stroke="rgba(255,255,255,0.04)"/>
  <line x1="236" y1="274" x2="734" y2="274" stroke="rgba(255,255,255,0.04)"/>
  <line x1="236" y1="310" x2="734" y2="310" stroke="rgba(255,255,255,0.06)"/>
  <!-- Normal + Threat curves -->
  <path d="M 236 326 L 236 292 L 298 282 L 360 296 L 422 254 L 484 268 L 546 228 L 608 256 L 670 220 L 734 242 L 734 326 Z" fill="url(#areaTraffic)"/>
  <path class="line-anim" d="M 236 292 L 298 282 L 360 296 L 422 254 L 484 268 L 546 228 L 608 256 L 670 220 L 734 242" fill="none" stroke="#00d9c0" stroke-width="2.2"/>
  <path d="M 236 326 L 236 318 L 298 315 L 360 320 L 422 302 L 484 312 L 546 286 L 608 308 L 670 278 L 734 298 L 734 326 Z" fill="url(#areaThreats)"/>
  <path class="line-anim" d="M 236 318 L 298 315 L 360 320 L 422 302 L 484 312 L 546 286 L 608 308 L 670 278 L 734 298" fill="none" stroke="#ef4a52" stroke-width="2"/>

  <!-- Right Card: Attack Distribution Donut -->
  <rect x="765" y="172" width="293" height="176" rx="12" fill="#111826" stroke="#232c40"/>
  <text x="781" y="194" fill="#e9edf5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Attack Distribution</text>
  <line x1="766" y1="204" x2="1057" y2="204" stroke="#1a2233"/>
  <!-- Donut Chart -->
  <g class="donut-spin">
    <circle cx="878" cy="258" r="36" fill="none" stroke="#ef4a52" stroke-width="14" stroke-dasharray="85 141" stroke-dashoffset="0"/>
    <circle cx="878" cy="258" r="36" fill="none" stroke="#f5943a" stroke-width="14" stroke-dasharray="60 166" stroke-dashoffset="-85"/>
    <circle cx="878" cy="258" r="36" fill="none" stroke="#e8c33c" stroke-width="14" stroke-dasharray="45 181" stroke-dashoffset="-145"/>
    <circle cx="878" cy="258" r="36" fill="none" stroke="#00d9c0" stroke-width="14" stroke-dasharray="36 190" stroke-dashoffset="-190"/>
  </g>
  <text x="878" y="262" text-anchor="middle" fill="#e9edf5" font-family="Consolas, monospace" font-size="12" font-weight="700">24</text>
  <!-- Donut Legend -->
  <circle cx="944" cy="236" r="4" fill="#ef4a52"/><text x="954" y="240" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10">DoS / Flood</text>
  <circle cx="944" cy="254" r="4" fill="#f5943a"/><text x="954" y="258" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10">Brute Force</text>
  <circle cx="944" cy="272" r="4" fill="#e8c33c"/><text x="954" y="276" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10">Port Scan</text>
  <circle cx="944" cy="290" r="4" fill="#00d9c0"/><text x="954" y="294" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10">SQLi / Web</text>

  <!-- Bottom Card: Latest Security Events Table -->
  <rect x="218" y="360" width="840" height="162" rx="12" fill="#111826" stroke="#232c40"/>
  <text x="234" y="382" fill="#e9edf5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Latest Security Events</text>
  <rect x="219" y="392" width="838" height="24" fill="#0c1119"/>
  <text x="234" y="408" fill="#576078" font-family="Consolas, monospace" font-size="9.5" font-weight="700">TIME</text>
  <text x="330" y="408" fill="#576078" font-family="Consolas, monospace" font-size="9.5" font-weight="700">SOURCE IP</text>
  <text x="480" y="408" fill="#576078" font-family="Consolas, monospace" font-size="9.5" font-weight="700">ATTACK TYPE</text>
  <text x="670" y="408" fill="#576078" font-family="Consolas, monospace" font-size="9.5" font-weight="700">ENGINE</text>
  <text x="790" y="408" fill="#576078" font-family="Consolas, monospace" font-size="9.5" font-weight="700">SEVERITY</text>
  <text x="920" y="408" fill="#576078" font-family="Consolas, monospace" font-size="9.5" font-weight="700">ACTION</text>

  <!-- Row 1 -->
  <text x="234" y="434" fill="#8b96ab" font-family="Consolas, monospace" font-size="10">2s ago</text>
  <text x="330" y="434" fill="#e9edf5" font-family="Consolas, monospace" font-size="10">203.0.113.45</text>
  <text x="480" y="434" fill="#e9edf5" font-family="Segoe UI, sans-serif" font-size="10.5">Denial of Service</text>
  <text x="670" y="434" fill="#00d9c0" font-family="Consolas, monospace" font-size="10">ml+suricata</text>
  <rect x="790" y="422" width="66" height="17" rx="4" fill="rgba(239,74,82,0.16)"/><text x="823" y="434" text-anchor="middle" fill="#ef4a52" font-family="Consolas, monospace" font-size="9.5" font-weight="700">CRITICAL</text>
  <rect x="920" y="422" width="56" height="17" rx="4" fill="rgba(239,74,82,0.16)"/><text x="948" y="434" text-anchor="middle" fill="#fca5a5" font-family="Consolas, monospace" font-size="9.5" font-weight="700">BLOCK</text>

  <!-- Row 2 -->
  <line x1="230" y1="446" x2="1044" y2="446" stroke="#1a2233"/>
  <text x="234" y="466" fill="#8b96ab" font-family="Consolas, monospace" font-size="10">9s ago</text>
  <text x="330" y="466" fill="#e9edf5" font-family="Consolas, monospace" font-size="10">192.168.56.101</text>
  <text x="480" y="466" fill="#e9edf5" font-family="Segoe UI, sans-serif" font-size="10.5">SSH Brute Force</text>
  <text x="670" y="466" fill="#00d9c0" font-family="Consolas, monospace" font-size="10">ml</text>
  <rect x="790" y="454" width="50" height="17" rx="4" fill="rgba(245,148,58,0.16)"/><text x="815" y="466" text-anchor="middle" fill="#f5943a" font-family="Consolas, monospace" font-size="9.5" font-weight="700">HIGH</text>
  <rect x="920" y="454" width="84" height="17" rx="4" fill="rgba(245,148,58,0.16)"/><text x="962" y="466" text-anchor="middle" fill="#fdba74" font-family="Consolas, monospace" font-size="9.5" font-weight="700">TEMP_BLOCK</text>

  <!-- Row 3 -->
  <line x1="230" y1="478" x2="1044" y2="478" stroke="#1a2233"/>
  <text x="234" y="498" fill="#8b96ab" font-family="Consolas, monospace" font-size="10">18s ago</text>
  <text x="330" y="498" fill="#e9edf5" font-family="Consolas, monospace" font-size="10">192.168.56.105</text>
  <text x="480" y="498" fill="#e9edf5" font-family="Segoe UI, sans-serif" font-size="10.5">TCP SYN / Port Scan</text>
  <text x="670" y="498" fill="#38bdf8" font-family="Consolas, monospace" font-size="10">suricata</text>
  <rect x="790" y="486" width="58" height="17" rx="4" fill="rgba(232,195,60,0.16)"/><text x="819" y="498" text-anchor="middle" fill="#e8c33c" font-family="Consolas, monospace" font-size="9.5" font-weight="700">MEDIUM</text>
  <rect x="920" y="486" width="56" height="17" rx="4" fill="rgba(51,199,119,0.14)"/><text x="948" y="498" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="9.5" font-weight="700">ALERT</text>
</svg>
