<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" width="100%">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0e1627"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cardT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0e1422"/>
    </linearGradient>
    <pattern id="gridT" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.055)"/>
    </pattern>
    <filter id="glowG" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#33c777"/>
    </marker>
  </defs>
  <style>
    .pipe-t { stroke-dasharray: 7 5; animation: flowT 1.3s linear infinite; }
    @keyframes flowT { to { stroke-dashoffset: -24; } }
  </style>

  <rect width="1040" height="270" rx="16" fill="url(#bgT)"/>
  <rect width="1040" height="270" rx="16" fill="url(#gridT)"/>
  <rect x="1" y="1" width="1038" height="268" rx="15" fill="none" stroke="rgba(51,199,119,0.25)" stroke-width="1.5"/>

  <text x="30" y="34" fill="#33c777" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.2">REPRODUCIBLE AI TRAINING  //  DEDUPLICATED &amp; LEAK-FREE</text>

  <!-- Pipes -->
  <path class="pipe-t" d="M 186 140 L 224 140" fill="none" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrG)"/>
  <path class="pipe-t" d="M 384 140 L 422 140" fill="none" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrG)"/>
  <path class="pipe-t" d="M 582 140 L 620 140" fill="none" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrG)"/>
  <path class="pipe-t" d="M 780 140 L 818 140" fill="none" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrG)"/>

  <!-- Moving Orbs -->
  <circle r="4.2" fill="#38bdf8" filter="url(#glowG)"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 186 140 L 224 140"/></circle>
  <circle r="4.2" fill="#00d9c0" filter="url(#glowG)"><animateMotion dur="1.5s" begin="0.4s" repeatCount="indefinite" path="M 384 140 L 422 140"/></circle>
  <circle r="4.2" fill="#33c777" filter="url(#glowG)"><animateMotion dur="1.5s" begin="0.8s" repeatCount="indefinite" path="M 582 140 L 620 140"/></circle>
  <circle r="4.2" fill="#f5943a" filter="url(#glowG)"><animateMotion dur="1.5s" begin="1.1s" repeatCount="indefinite" path="M 780 140 L 818 140"/></circle>

  <!-- Step 1: CICIDS2017 -->
  <rect x="28" y="76" width="158" height="128" rx="14" fill="url(#cardT)" stroke="rgba(56,189,248,0.65)" stroke-width="1.8"/>
  <rect x="28" y="76" width="158" height="4" rx="2" fill="#38bdf8"/>
  <g transform="translate(107, 108)">
    <ellipse cx="0" cy="-7" rx="13" ry="5" fill="#0b1322" stroke="#38bdf8" stroke-width="1.6"/>
    <path d="M-13 -7 V7 C-13 10 13 10 13 7 V-7" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
  </g>
  <text x="107" y="144" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">CICIDS2017</text>
  <text x="107" y="164" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="10">12 Live Features</text>
  <text x="107" y="182" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">Chunked Sampling</text>

  <!-- Step 2: Deduplicate -->
  <rect x="226" y="76" width="158" height="128" rx="14" fill="url(#cardT)" stroke="rgba(0,217,192,0.65)" stroke-width="1.8"/>
  <rect x="226" y="76" width="158" height="4" rx="2" fill="#00d9c0"/>
  <g transform="translate(305, 108)">
    <path d="M-13 -9 H13 L4 1 V10 L-4 10 V1 Z" fill="#0b1322" stroke="#00d9c0" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="305" y="144" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Deduplicate</text>
  <text x="305" y="164" text-anchor="middle" fill="#00d9c0" font-family="Consolas, monospace" font-size="10">0% Train/Test Leak</text>
  <text x="305" y="182" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">80 / 10 / 10 Split</text>

  <!-- Step 3: Preprocess -->
  <rect x="424" y="76" width="158" height="128" rx="14" fill="url(#cardT)" stroke="rgba(0,217,192,0.65)" stroke-width="1.8"/>
  <rect x="424" y="76" width="158" height="4" rx="2" fill="#00d9c0"/>
  <g transform="translate(503, 108)">
    <path d="M-13 9 Q -4 9, 0 0 T 13 -9" fill="none" stroke="#00d9c0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-13" y1="9" x2="13" y2="9" stroke="#475569" stroke-width="1.2"/>
  </g>
  <text x="503" y="144" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Preprocess</text>
  <text x="503" y="164" text-anchor="middle" fill="#00d9c0" font-family="Consolas, monospace" font-size="10">Median + Log1p</text>
  <text x="503" y="182" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">StandardScaler</text>

  <!-- Step 4: XGBoost -->
  <rect x="622" y="76" width="158" height="128" rx="14" fill="url(#cardT)" stroke="rgba(51,199,119,0.75)" stroke-width="1.8"/>
  <rect x="622" y="76" width="158" height="4" rx="2" fill="#33c777"/>
  <g transform="translate(701, 108)">
    <circle cx="0" cy="-9" r="3.5" fill="#33c777"/>
    <circle cx="-9" cy="6" r="3.5" fill="#86efac"/>
    <circle cx="9" cy="6" r="3.5" fill="#86efac"/>
    <line x1="0" y1="-6" x2="-9" y2="3" stroke="#33c777" stroke-width="1.6"/>
    <line x1="0" y1="-6" x2="9" y2="3" stroke="#33c777" stroke-width="1.6"/>
  </g>
  <text x="701" y="144" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">XGBClassifier</text>
  <text x="701" y="164" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="10">Smoothed Weights</text>
  <text x="701" y="182" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">L1/L2 Regularized</text>

  <!-- Step 5: Verified Metrics -->
  <rect x="820" y="76" width="192" height="128" rx="14" fill="#0d241d" stroke="rgba(51,199,119,0.8)" stroke-width="1.8"/>
  <rect x="820" y="76" width="192" height="4" rx="2" fill="#33c777"/>
  <text x="916" y="106" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="11" font-weight="700">TEST SET METRICS</text>
  <text x="916" y="136" text-anchor="middle" fill="#f8fafc" font-family="Consolas, monospace" font-size="22" font-weight="800">92.34% F1</text>
  <text x="916" y="159" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="11">99.07% Accuracy</text>
  <text x="916" y="184" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">31,118 Clean Rows</text>
</svg>
