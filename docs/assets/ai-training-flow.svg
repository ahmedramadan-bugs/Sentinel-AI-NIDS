<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%">
  <defs>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#33c777"/>
    </marker>
  </defs>
  <style>
    .pipe-g { stroke-dasharray: 7 5; animation: flowG 1.4s linear infinite; }
    @keyframes flowG { to { stroke-dashoffset: -24; } }
  </style>

  <rect width="1000" height="240" rx="16" fill="#080b11" stroke="#1e293b" stroke-width="1.5"/>
  <text x="28" y="34" fill="#33c777" font-family="Consolas, monospace" font-size="13" font-weight="700">REPRODUCIBLE AI TRAINING PIPELINE (ZERO DATA LEAKAGE)</text>

  <line class="pipe-g" x1="175" y1="125" x2="215" y2="125" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <line class="pipe-g" x1="365" y1="125" x2="405" y2="125" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <line class="pipe-g" x1="565" y1="125" x2="605" y2="125" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <line class="pipe-g" x1="775" y1="125" x2="815" y2="125" stroke="#33c777" stroke-width="2.2" marker-end="url(#arrGreen)"/>

  <rect x="25" y="75" width="150" height="100" rx="12" fill="#111826" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="100" y="106" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="11" font-weight="700">1. DATASET</text>
  <text x="100" y="128" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">CICIDS2017</text>
  <text x="100" y="148" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">Streamed Chunks</text>

  <rect x="218" y="75" width="147" height="100" rx="12" fill="#111826" stroke="#00d9c0" stroke-width="1.8"/>
  <text x="291" y="106" text-anchor="middle" fill="#00d9c0" font-family="Consolas, monospace" font-size="11" font-weight="700">2. DEDUPLICATE</text>
  <text x="291" y="128" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Clean &amp; Split</text>
  <text x="291" y="148" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">80 / 10 / 10 Split</text>

  <rect x="408" y="75" width="157" height="100" rx="12" fill="#111826" stroke="#00d9c0" stroke-width="1.8"/>
  <text x="486" y="106" text-anchor="middle" fill="#00d9c0" font-family="Consolas, monospace" font-size="11" font-weight="700">3. PREPROCESS</text>
  <text x="486" y="128" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Impute + Log1p</text>
  <text x="486" y="148" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">StandardScaler</text>

  <rect x="608" y="75" width="167" height="100" rx="12" fill="#0f2922" stroke="#33c777" stroke-width="2"/>
  <text x="691" y="106" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="11" font-weight="700">4. TRAIN</text>
  <text x="691" y="128" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">XGBClassifier</text>
  <text x="691" y="148" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="10">Macro F1: 92.34%</text>

  <rect x="818" y="75" width="157" height="100" rx="12" fill="#111826" stroke="#f5943a" stroke-width="1.8"/>
  <text x="896" y="106" text-anchor="middle" fill="#fdba74" font-family="Consolas, monospace" font-size="11" font-weight="700">5. ARTIFACTS</text>
  <text x="896" y="128" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Saved Bundle</text>
  <text x="896" y="148" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">model + scaler + pkl</text>
</svg>
